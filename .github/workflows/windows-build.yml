name: windows-build

# Builds the native Windows installer. PyInstaller can't cross-compile, so this
# runs on a real windows-latest runner. Trigger manually (optionally attaching to
# a release tag) or automatically when a release is published.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach assets to (blank = build artifacts only)"
        required: false
        default: "v0.1.0"
  release:
    types: [published]

permissions:
  contents: write   # upload release assets

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: python -m pip install --upgrade pip pyinstaller pywinpty

      - name: Build ZENITH.exe (PyInstaller, one-file)
        shell: pwsh
        run: |
          $env:ZENITH_REPO_ROOT = (Get-Location).Path
          $env:ZENITH_CONSOLE = "0"   # windowed (no console window); errors go to ~/.zenith/startup-error.log
          pyinstaller --noconfirm --distpath dist --workpath build packaging/windows/zenith-windows.spec
          if (-not (Test-Path dist/ZENITH.exe)) { throw "dist/ZENITH.exe was not produced" }

      - name: Smoke test — server responds 200
        shell: pwsh
        run: |
          $env:ZENITH_PORT = "8799"
          $env:ZENITH_NO_BROWSER = "1"
          $p = Start-Process -FilePath "dist/ZENITH.exe" -PassThru -RedirectStandardOutput out.log -RedirectStandardError err.log
          $ok = $false
          foreach ($i in 1..90) {
            if ($p.HasExited) { break }
            try {
              $r = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8799/api/overview" -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
            Start-Sleep -Seconds 1
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          if (-not $ok) {
            Write-Host "HasExited=$($p.HasExited) ExitCode=$($p.ExitCode)"
            Write-Host "=== stdout ==="; if (Test-Path out.log) { Get-Content out.log }
            Write-Host "=== stderr ==="; if (Test-Path err.log) { Get-Content err.log }
            $err = Join-Path $env:USERPROFILE ".zenith\startup-error.log"
            Write-Host "=== startup-error.log ==="; if (Test-Path $err) { Get-Content $err }
            throw "server did not return 200 on /api/overview"
          }
          Write-Host "health OK (200)"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $ver = (Get-Content VERSION -Raw).Trim()
          & $iscc "/DMyAppVersion=$ver" packaging\windows\zenith.iss
          if (-not (Test-Path dist/ZENITH-Setup.exe)) { throw "installer not produced" }
          Copy-Item dist/ZENITH.exe dist/ZENITH-windows-x64.exe   # portable single-file

      - name: Upload build artifacts (always downloadable from the run)
        uses: actions/upload-artifact@v4
        with:
          name: zenith-windows
          path: |
            dist/ZENITH-Setup.exe
            dist/ZENITH-windows-x64.exe

      - name: Attach to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          $tag = if ($env:EVENT_NAME -eq "release") { $env:RELEASE_TAG } else { $env:INPUT_TAG }
          if ([string]::IsNullOrWhiteSpace($tag)) { Write-Host "no tag -> build artifacts only"; exit 0 }
          gh release upload $tag dist/ZENITH-Setup.exe dist/ZENITH-windows-x64.exe --clobber --repo $env:REPO
          Write-Host "attached to release $tag"
