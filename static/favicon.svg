<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="zg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ceeff"/>
      <stop offset="0.55" stop-color="#3fe3ff"/>
      <stop offset="1" stop-color="#1e8fa8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#3fe3ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3fe3ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>

  <!-- panel -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="#060d14"/>
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#glow)"/>
  <rect x="3.9" y="3.9" width="56.2" height="56.2" rx="14.2" fill="none"
        stroke="#3fe3ff" stroke-opacity="0.5" stroke-width="1.4"/>
  <!-- top light seam -->
  <path d="M18 4.2 H46" stroke="#8ceeff" stroke-opacity="0.85" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Z monogram -->
  <g filter="url(#soft)" opacity="0.5">
    <path d="M20 21 H44 L26 41 H44" fill="none" stroke="#3fe3ff"
          stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M20 21 H44 L26 41 H44" fill="none" stroke="url(#zg)"
        stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- zenith spark (4-point star) at the apex -->
  <g transform="translate(46.5 17)">
    <path d="M0 -6 L1.5 -1.5 L6 0 L1.5 1.5 L0 6 L-1.5 1.5 L-6 0 L-1.5 -1.5 Z"
          fill="#eaf7fc"/>
    <circle cx="0" cy="0" r="1.6" fill="#ffffff"/>
  </g>
</svg>
